apiVersion: skaffold/v4beta8
kind: Config
metadata:
  name: sci-pulse
build:
  tagPolicy:
    sha256: {}
  artifacts:
    - image: registry.jetbrains.team/p/edu-research/containers/sci-pulse-image
      context: ../
      docker:
        dockerfile: cronjob.Dockerfile
  local:
    useDockerCLI: false
    useBuildkit: true
deploy:
  helm:
    releases:
      - name: sci-pulse
        remoteChart: oci://registry.jetbrains.team/p/cb/helm-charts/cronjob
        version: 0.2.1
        upgradeOnChange: true
        setValueTemplates:
          image: "{{.IMAGE_FULLY_QUALIFIED}}"
          imagePullSecret: "{{.IMAGE_PULL_SECRET}}"
          applicationName: "{{.APPLICATION_NAME}}"
        valuesFiles:
          - values.yaml
